<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB Global Group Structure</title>
<style>
  :root {
    --bg: #f4f4f4;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --line: #c9c9c9;
    --shadow: 0 1px 4px rgba(0,0,0,.08);
    /* Division colours: strip, pill background, pill text */
    --logistics: #e85d3a;  --logistics-bg: #fdebe5; --logistics-fg: #8a2e14;
    --tech: #8b4cf7;       --tech-bg: #efe6fe;      --tech-fg: #4b1fa0;
    --shipping: #1d9e75;   --shipping-bg: #e1f5ee;  --shipping-fg: #085041;
    --property: #2f6fd6;   --property-bg: #e6f0fb;  --property-fg: #0c3f7c;
    --group: #1a1a1a;      --group-bg: #ececec;     --group-fg: #1a1a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg) radial-gradient(#d4d4d4 1px, transparent 1px) 0 0 / 20px 20px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 32px 16px 64px; }

  /* ---------- Top bar: division tabs + search ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid #e3e3e3;
  }
  .topbar-inner {
    max-width: 1280px; margin: 0 auto; padding: 10px 16px;
    display: flex; align-items: center; gap: 16px;
  }
  .tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    border: 0; background: none; font: inherit; font-size: 14px; color: var(--muted);
    padding: 8px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { background: #f2f2f2; color: var(--text); }
  .tab[aria-pressed="true"] { background: var(--text); color: #fff; }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, #999); }
  .search { position: relative; width: 280px; flex: 0 0 auto; }
  .search input {
    width: 100%; font: inherit; font-size: 14px; padding: 8px 12px 8px 34px;
    border: 1px solid #d6d6d6; border-radius: 8px; background: #fafafa;
  }
  .search input:focus { outline: 2px solid #2f6fd6; outline-offset: 1px; background: #fff; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: #888; fill: none; stroke-width: 2; }
  .results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; margin: 0; padding: 4px;
    list-style: none; background: #fff; border: 1px solid #e0e0e0; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 320px; overflow-y: auto;
  }
  .results[hidden] { display: none; }
  .results li {
    padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .results li .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: 0 0 auto; }
  .results li small { color: var(--muted); margin-left: auto; font-size: 12px; }
  .results li[aria-selected="true"], .results li:hover { background: #f2f2f2; }
  .results li.empty { cursor: default; color: var(--muted); }
  .results li.empty:hover { background: none; }
  .division[hidden] { display: none; }
  @media (max-width: 700px) {
    .topbar-inner { flex-direction: column-reverse; align-items: stretch; gap: 8px; }
    .search { width: 100%; }
  }

  /* ---------- Top: GB Global ---------- */
  .top { display: flex; justify-content: center; margin-bottom: 8px; }
  .top-card {
    background: var(--card); border-radius: 12px; box-shadow: var(--shadow);
    border-top: 6px solid var(--group); padding: 20px 40px; text-align: center;
  }
  .top-card h1 { margin: 0; font-size: 24px; font-weight: 600; }
  .top-card p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .stem { width: 1px; height: 28px; background: var(--line); margin: 0 auto; }

  /* ---------- Divisions and brand cards ---------- */
  .division { margin-top: 28px; }
  .division h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 600; margin: 0 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .division h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .brand {
    position: relative; background: var(--card); border: 2px solid transparent; border-radius: 12px;
    box-shadow: var(--shadow); padding: 0 0 14px; cursor: pointer; text-align: center;
    overflow: hidden; font: inherit; color: inherit; width: 100%;
    transition: transform .15s, border-color .15s;
  }
  .brand::before { content: ""; display: block; height: 6px; background: var(--c); margin-bottom: 14px; }
  .brand:hover { transform: translateY(-2px); }
  .brand:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
  .brand[aria-expanded="true"] { border-color: var(--c); }
  .brand .mono {
    width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 8px;
    background: var(--cbg); color: var(--cfg); display: grid; place-items: center;
    font-weight: 600; font-size: 14px;
  }
  .brand .name { font-weight: 600; font-size: 15px; padding: 0 10px; }
  .brand .chev { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .brand[aria-expanded="true"] .chev { color: var(--cfg); }

  /* ---------- Structure panel ---------- */
  .panel {
    margin-top: 16px; background: var(--card); border-radius: 12px; box-shadow: var(--shadow);
    border-top: 6px solid var(--c); padding: 20px 20px 28px;
  }
  .panel[hidden] { display: none; }
  .panel, .division { scroll-margin-top: 80px; }
  .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
  .panel-head h3 { margin: 0; font-size: 20px; }
  .panel-head a { font-size: 13px; color: var(--cfg); }
  .close {
    border: 1px solid #ddd; background: #fff; border-radius: 8px; padding: 6px 12px;
    cursor: pointer; font: inherit; font-size: 13px;
  }
  .tree-scroll { overflow-x: auto; padding-bottom: 8px; }

  /* Tree connectors */
  .tree ul { position: relative; display: flex; justify-content: center; padding: 20px 0 0; margin: 0; }
  .tree > ul { padding-top: 12px; }
  .tree li { list-style: none; position: relative; padding: 20px 8px 0; display: flex; flex-direction: column; align-items: center; }
  .tree li::before, .tree li::after {
    content: ""; position: absolute; top: 0; right: 50%; width: 50%; height: 20px; border-top: 1px solid var(--line);
  }
  .tree li::after { right: auto; left: 50%; border-left: 1px solid var(--line); }
  .tree li:only-child::before, .tree li:only-child::after { display: none; }
  .tree li:only-child { padding-top: 0; }
  .tree li:first-child::before, .tree li:last-child::after { border: 0; }
  .tree li:last-child::before { border-right: 1px solid var(--line); border-radius: 0 6px 0 0; }
  .tree li:first-child::after { border-radius: 6px 0 0 0; }
  .tree ul ul::before { content: ""; position: absolute; top: 0; left: 50%; height: 20px; border-left: 1px solid var(--line); }

  /* Person card (matches the Figma card) */
  .person {
    width: 200px; background: var(--card); border-radius: 12px; box-shadow: 0 1px 5px rgba(0,0,0,.12);
    overflow: hidden; text-align: center; padding-bottom: 14px;
  }
  .person::before { content: ""; display: block; height: 6px; background: var(--c); margin-bottom: 14px; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 8px; background: var(--cbg);
    border: 1px solid var(--c); display: grid; place-items: center; overflow: hidden;
  }
  .avatar svg { width: 36px; height: 36px; margin-top: 10px; stroke: var(--c); fill: none; stroke-width: 1.5; }
  .person .pname { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 0 14px; margin-top: 5px; font-size: 13px; color: var(--muted); text-align: left; }
  .tag {
    flex: 0 0 52px; background: var(--cbg); color: var(--cfg); font-size: 10px; font-weight: 600;
    letter-spacing: .04em; text-align: center; padding: 3px 0; border-radius: 4px;
  }
  .note { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
  .note.warn { color: #a32d2d; }
  .brand .count { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .loadbox {
    background: #fff8e6; border: 1px solid #f0c36d; border-radius: 12px;
    padding: 16px 20px; margin-bottom: 24px; font-size: 14px;
  }
  .loadbox p { margin: 6px 0; }

  /* Division colour mapping */
  [data-div="logistics"] { --c: var(--logistics); --cbg: var(--logistics-bg); --cfg: var(--logistics-fg); }
  [data-div="tech"]      { --c: var(--tech);      --cbg: var(--tech-bg);      --cfg: var(--tech-fg); }
  [data-div="shipping"]  { --c: var(--shipping);  --cbg: var(--shipping-bg);  --cfg: var(--shipping-fg); }
  [data-div="property"]  { --c: var(--property);  --cbg: var(--property-bg);  --cfg: var(--property-fg); }

  @media (prefers-reduced-motion: reduce) { .brand { transition: none; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <nav class="tabs" id="tabs" aria-label="Divisions"></nav>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Find a company" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="results" aria-label="Find a company">
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="top"><div class="top-card"><h1>GB Global</h1><p>Group structure</p></div></div>
  <div class="stem"></div>
  <div id="divisions"></div>
</div>

<script>
/* =========================================================
   1. SETTINGS AND COMPANY LIST
   People are NOT stored here. They come from the spreadsheet
   (structure.csv) with columns:
     company_id, person_id, name, role, team, reports_to
   company_id must match an "id" below.

   DATA_URL: the CSV file next to this page, or a published
   Google Sheet CSV link.
   ========================================================= */
const DATA_URL = "structure.csv";

/* Each company:
     id        unique, lowercase, no spaces (also used in the URL: page.html#uniserve)
     name      display name
     division  logistics | tech | shipping | property
     website   optional link
*/
const DIVISIONS = {
  logistics: "Logistics and supply chain",
  tech:      "Technology, consulting, education and outsourcing",
  shipping:  "Container shipping services",
  property:  "Property development and investment"
};
/* Short names used on the tabs at the top */
const TAB_LABELS = { logistics: "Logistics", tech: "Technology", shipping: "Shipping", property: "Property" };

const COMPANIES = [
  { id: "uniserve",              name: "Uniserve",               division: "logistics", website: "http://uniserve.co.uk" },
  { id: "metro",                 name: "Metro",                  division: "logistics", website: "https://metro.global/" },
  { id: "james-kemball",         name: "James Kemball",          division: "logistics", website: "https://www.kemball.co.uk/" },
  { id: "george-baker",          name: "George Baker Shipping",  division: "logistics", website: "https://georgebakershipping.com/" },
  { id: "klog",                  name: "Klog",                   division: "logistics", website: "https://www.klog.pt/pt/" },
  { id: "efret",                 name: "Efret",                  division: "logistics", website: "https://www.efret.eu/" },
  { id: "wineflow",              name: "Wineflow",               division: "logistics", website: "https://www.wineflow.com/" },
  { id: "procarrier",            name: "ProCarrier",             division: "logistics", website: "https://weareprocarrier.com/" },
  { id: "seafast",               name: "Seafast",                division: "logistics", website: "https://www.seafast.com/" },
  { id: "atrax",                 name: "Atrax Logistics",        division: "logistics", website: "https://atraxlogistics.co.za/" },
  { id: "total-customs",         name: "Total Customs",          division: "logistics", website: "https://www.totalcustoms.ro/tc/" },
  { id: "tendron",               name: "Tendron Logistics",      division: "logistics", website: "https://www.tendron.com/en/tendron-logistics/" },
  { id: "mytendron",             name: "MyTendron",              division: "logistics", website: "https://mytendron.com/" },
  { id: "uniserve-nl",           name: "Uniserve Netherlands",   division: "logistics", website: "https://unieurope.nl/" },
  { id: "uniserve-ie",           name: "Uniserve Ireland",       division: "logistics", website: "https://uniserve.ie/" },

  { id: "one-world",             name: "One World",              division: "tech", website: "https://owgtm.com/" },
  { id: "customs-insights",      name: "Customs Insights",       division: "tech", website: "https://customsinsights.co.uk/" },
  { id: "beyondly",              name: "Beyondly",               division: "tech", website: "https://www.beyond.ly/" },
  { id: "supply-chain-academy",  name: "Supply Chain Academy",   division: "tech", website: "https://supplychainacademy.org.uk/" },
  { id: "bkr",                   name: "BKR Consultants",        division: "tech", website: "https://www.bkrconsultants.com/" },
  { id: "city-global",           name: "City Global",            division: "tech" },

  { id: "ellerman",              name: "Ellerman Lines",         division: "shipping", website: "https://ellermanlines.com/" },
  { id: "viasea",                name: "Viasea",                 division: "shipping", website: "https://www.viasea.com/home" },
  { id: "uniocean",              name: "UniOcean Lines",         division: "shipping", website: "https://unioceanlines.com/" },

  { id: "gb-europe",             name: "GB Europe",              division: "property" },
  { id: "gb-construct",          name: "GB Construct",           division: "property" }
];

/* =========================================================
   2. SPREADSHEET LOADING
   ========================================================= */
const REQUIRED = ["company_id", "person_id", "name", "role", "team", "reports_to"];
let PEOPLE = {};          // { company_id: [rows] }
let loaded = false;

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += ch;
    } else if (ch === '"') q = true;
    else if (ch === "," ) { row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(f); rows.push(row); row = []; f = "";
    } else f += ch;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

function ingest(text) {
  const rows = parseCSV(text.replace(/^\uFEFF/, ""));
  if (!rows.length) throw new Error("The spreadsheet is empty.");
  const head = rows.shift().map(h => h.trim().toLowerCase());
  const missing = REQUIRED.filter(h => !head.includes(h));
  if (missing.length) throw new Error("Missing column(s): " + missing.join(", "));
  PEOPLE = {};
  rows.forEach(r => {
    const o = {};
    head.forEach((h, i) => o[h] = (r[i] || "").trim());
    if (!o.company_id || !o.person_id) return;
    (PEOPLE[o.company_id] ??= []).push(o);
  });
  loaded = true;
}

/* Turns one company's rows into trees using reports_to */
function buildTrees(list) {
  const byId = new Map(list.map(p => [p.person_id, { ...p, children: [] }]));
  const roots = [], warnings = [];
  byId.forEach(n => {
    const boss = n.reports_to ? byId.get(n.reports_to) : null;
    if (boss && boss !== n) boss.children.push(n);
    else {
      if (n.reports_to) warnings.push(`${n.name || n.person_id} reports to "${n.reports_to}", which isn't listed for this company.`);
      roots.push(n);
    }
  });
  const seen = new Set();
  (function walk(ns) { ns.forEach(n => { if (seen.has(n)) return; seen.add(n); walk(n.children); }); })(roots);
  if (seen.size < byId.size) warnings.push(`${byId.size - seen.size} person(s) not shown: their reports_to values form a loop.`);
  return { roots, warnings };
}

function showLoadProblem(message) {
  const box = document.createElement("div");
  box.className = "loadbox";
  box.innerHTML = `
    <strong>Couldn't load the structure spreadsheet.</strong>
    <p>${esc(message)}</p>
    <p>If you opened this page straight from your computer, browsers block it from reading files automatically. Choose the CSV here instead:</p>
    <input type="file" accept=".csv,text/csv">`;
  document.querySelector(".wrap").prepend(box);
  box.querySelector("input").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try { ingest(reader.result); box.remove(); ready(); }
      catch (err) { box.querySelector("p").textContent = err.message; }
    };
    reader.readAsText(file);
  });
}

/* =========================================================
   2. RENDERING — you shouldn't need to edit below here.
   ========================================================= */
const AVATAR = '<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="10" r="8"/><path d="M14 11.5q4 3.5 8 0"/><path d="M2 36q16-18 32 0"/></svg>';
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const initials = n => n.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();

function personCard(p) {
  return `<div class="person">
      <div class="avatar">${AVATAR}</div>
      <div class="pname">${esc(p.name)}</div>
      <div class="row"><span class="tag">ROLE</span>${esc(p.role)}</div>
      <div class="row"><span class="tag">TEAM</span>${esc(p.team)}</div>
    </div>`;
}
function treeHTML(node) {
  const kids = (node.children || []).map(treeHTML).join("");
  return `<li>${personCard(node)}${kids ? `<ul>${kids}</ul>` : ""}</li>`;
}

const root = document.getElementById("divisions");
let openId = null;

// Build each division: heading, grid of brand cards, one shared panel
Object.entries(DIVISIONS).forEach(([key, label]) => {
  const list = COMPANIES.filter(c => c.division === key);
  if (!list.length) return;
  const sec = document.createElement("section");
  sec.className = "division";
  sec.dataset.div = key;
  sec.innerHTML = `
    <h2>${esc(label)}</h2>
    <div class="grid">
      ${list.map(c => `
        <button class="brand" type="button" data-id="${esc(c.id)}" aria-expanded="false" aria-controls="panel-${key}">
          <div class="mono">${esc(initials(c.name))}</div>
          <div class="name">${esc(c.name)}</div>
          <span class="count"></span>
          <span class="chev">View structure ▾</span>
        </button>`).join("")}
    </div>
    <div class="panel" id="panel-${key}" hidden></div>`;
  root.appendChild(sec);
});

function closeAll() {
  document.querySelectorAll(".brand").forEach(b => {
    b.setAttribute("aria-expanded", "false");
    b.querySelector(".chev").textContent = "View structure ▾";
  });
  document.querySelectorAll(".panel").forEach(p => { p.hidden = true; p.innerHTML = ""; });
  openId = null;
  history.replaceState(null, "", location.pathname + location.search);
}

function openCompany(id, scroll = true) {
  const c = COMPANIES.find(x => x.id === id);
  if (!c) return;
  closeAll();                                   // only one structure open at a time
  if (activeTab !== "all" && activeTab !== c.division) setTab(c.division);
  const btn = document.querySelector(`.brand[data-id="${CSS.escape(id)}"]`);
  const panel = document.getElementById(`panel-${c.division}`);
  btn.setAttribute("aria-expanded", "true");
  btn.querySelector(".chev").textContent = "Hide structure ▴";
  const rows = PEOPLE[c.id] || [];
  const { roots, warnings } = buildTrees(rows);
  let body;
  if (!loaded) body = `<p class="note">The structure spreadsheet hasn't loaded yet.</p>`;
  else if (!rows.length) body = `<p class="note">No structure added yet. Add rows with company_id "${esc(c.id)}" to the spreadsheet.</p>`;
  else body = `<div class="tree-scroll"><div class="tree"><ul>${roots.map(treeHTML).join("")}</ul></div></div>`;
  panel.innerHTML = `
    <div class="panel-head">
      <div>
        <h3>${esc(c.name)}</h3>
        ${c.website ? `<a href="${esc(c.website)}" target="_blank" rel="noopener">Visit website</a>` : ""}
      </div>
      <button class="close" type="button">Close</button>
    </div>
    ${body}
    ${warnings.map(w => `<p class="note warn">${esc(w)}</p>`).join("")}`;
  panel.hidden = false;
  panel.querySelector(".close").addEventListener("click", () => { closeAll(); btn.focus(); });
  openId = id;
  history.replaceState(null, "", "#" + id);    // shareable link to this company
  if (scroll) panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

root.addEventListener("click", e => {
  const btn = e.target.closest(".brand");
  if (!btn) return;
  const id = btn.dataset.id;
  id === openId ? closeAll() : openCompany(id);  // clicking the open one closes it
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && openId && e.target !== searchInput) closeAll();
});

/* ---------- Division tabs ---------- */
let activeTab = "all";
const tabsEl = document.getElementById("tabs");
tabsEl.innerHTML =
  `<button class="tab" type="button" data-tab="all" aria-pressed="true">All companies</button>` +
  Object.keys(DIVISIONS)
    .filter(k => COMPANIES.some(c => c.division === k))
    .map(k => `<button class="tab" type="button" data-tab="${k}" data-div="${k}" aria-pressed="false"><span class="dot"></span>${esc(TAB_LABELS[k] || DIVISIONS[k])}</button>`)
    .join("");

function setTab(key) {
  activeTab = key;
  tabsEl.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", String(t.dataset.tab === key)));
  document.querySelectorAll(".division").forEach(s => { s.hidden = key !== "all" && s.dataset.div !== key; });
  // close a structure that is no longer visible
  if (openId) {
    const c = COMPANIES.find(x => x.id === openId);
    if (c && key !== "all" && c.division !== key) closeAll();
  }
}
tabsEl.addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (!t) return;
  setTab(t.dataset.tab);
  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* ---------- Search ---------- */
const searchInput = document.getElementById("search");
const resultsEl = document.getElementById("results");
let matches = [], active = -1;

function showResults() {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { hideResults(); return; }
  matches = COMPANIES.filter(c => c.name.toLowerCase().includes(q))
    .sort((a, b) => a.name.toLowerCase().indexOf(q) - b.name.toLowerCase().indexOf(q))
    .slice(0, 10);
  active = matches.length ? 0 : -1;
  resultsEl.innerHTML = matches.length
    ? matches.map((c, i) => `<li role="option" id="opt-${i}" data-id="${esc(c.id)}" data-div="${c.division}" aria-selected="${i === active}">
        <span class="dot"></span>${esc(c.name)}<small>${esc(TAB_LABELS[c.division] || "")}</small></li>`).join("")
    : `<li class="empty">No companies match "${esc(searchInput.value.trim())}"</li>`;
  resultsEl.hidden = false;
  searchInput.setAttribute("aria-expanded", "true");
  searchInput.setAttribute("aria-activedescendant", active >= 0 ? "opt-0" : "");
}
function hideResults() {
  resultsEl.hidden = true; resultsEl.innerHTML = ""; matches = []; active = -1;
  searchInput.setAttribute("aria-expanded", "false");
  searchInput.removeAttribute("aria-activedescendant");
}
function moveActive(step) {
  if (!matches.length) return;
  active = (active + step + matches.length) % matches.length;
  resultsEl.querySelectorAll("li").forEach((li, i) => li.setAttribute("aria-selected", String(i === active)));
  searchInput.setAttribute("aria-activedescendant", "opt-" + active);
  resultsEl.querySelector(`#opt-${active}`).scrollIntoView({ block: "nearest" });
}
function choose(id) {
  hideResults();
  searchInput.value = "";
  openCompany(id, true);
  document.querySelector(`.brand[data-id="${CSS.escape(id)}"]`).focus({ preventScroll: true });
}

searchInput.addEventListener("input", showResults);
searchInput.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); resultsEl.hidden ? showResults() : moveActive(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveActive(-1); }
  else if (e.key === "Enter") { e.preventDefault(); if (active >= 0) choose(matches[active].id); }
  else if (e.key === "Escape") { searchInput.value ? (searchInput.value = "") : searchInput.blur(); hideResults(); }
});
resultsEl.addEventListener("mousedown", e => {
  const li = e.target.closest("li[data-id]");
  if (li) { e.preventDefault(); choose(li.dataset.id); }
});
searchInput.addEventListener("blur", () => setTimeout(hideResults, 100));
// Press "/" anywhere to jump to the search box
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== searchInput && !/input|textarea/i.test(document.activeElement.tagName)) {
    e.preventDefault(); searchInput.focus();
  }
});

// After the data loads: show people counts and open a company from the URL (e.g. #metro)
function ready() {
  document.querySelectorAll(".brand").forEach(b => {
    const n = (PEOPLE[b.dataset.id] || []).length;
    b.querySelector(".count").textContent = n ? `${n} ${n === 1 ? "person" : "people"}` : "No structure yet";
  });
  const id = location.hash.slice(1) || openId;
  if (id) openCompany(id, true);
}

fetch(DATA_URL, { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(`"${DATA_URL}" returned ${r.status}.`); return r.text(); })
  .then(text => { ingest(text); ready(); })
  .catch(err => showLoadProblem(err.message));
</script>
